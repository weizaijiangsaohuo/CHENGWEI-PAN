name: Starflow UI and TypeScript

on:
  pull_request:
    paths:
      - 'starflow-social/**'
      - '.github/workflows/starflow-ui-check.yml'
  push:
    branches:
      - main
    paths:
      - 'starflow-social/**'
      - '.github/workflows/starflow-ui-check.yml'

permissions:
  contents: read

concurrency:
  group: starflow-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: starflow-social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: starflow-social/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --test backend/auth/preview-access.test.mjs backend/auth/preview-runtime.test.mjs backend/auth/inbox-sync.test.mjs backend/migration/compare-inventory.test.mjs backend/migration/legacy-post-plan.test.mjs
      - run: npm run check
      - run: npm run lint
      - run: npm run build

      # OpenNext must run its own standalone Next build; the normal build lacks its manifests.
      # No cloud deployment and no account credentials.
      - name: Build OpenNext Worker locally
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run build:cloudflare
      - name: Smoke-test disabled v2 routes in local workerd
        env:
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port 8787 --var STARFLOW_V2_ENABLED:false --var STARFLOW_V2_PREVIEW_ONLY:true > "$RUNNER_TEMP/starflow-workerd.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          if ! node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin='http://127.0.0.1:8787';
          const paths=['/api/v2/readiness','/api/v2/me','/api/identity/auth/get-session'];
          let ready=false;
          for(let i=0;i<60;i++){
            try {
              const response=await fetch(origin+paths[0],{redirect:'manual',signal:AbortSignal.timeout(1500)});
              if(response.status===404 && (await response.json()).error==='not_permitted'){ready=true;break;}
            } catch {}
            await new Promise(resolve=>setTimeout(resolve,1000));
          }
          assert.ok(ready,'local Worker did not serve the guarded route');
          for(const path of paths){
            const response=await fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(5000)});
            assert.equal(response.status,404,path);
            assert.deepEqual(await response.json(),{error:'not_permitted'});
            assert.match(response.headers.get('cache-control')??'',/no-store/i);
          }
          const response=await fetch(origin+'/api/identity/auth/sign-in/email',{
            method:'POST',redirect:'manual',signal:AbortSignal.timeout(5000),
            headers:{origin,'content-type':'application/json','cf-access-authenticated-user-email':'synthetic@example.invalid'},
            body:JSON.stringify({email:'synthetic@example.invalid',password:'fixture-only'})
          });
          assert.equal(response.status,404);
          assert.deepEqual(await response.json(),{error:'not_permitted'});
          console.log('PASS: bundled Worker denies disabled v2 requests, including forged identity headers');
          JS
          then
            tail -100 "$RUNNER_TEMP/starflow-workerd.log"
            exit 1
          fi
