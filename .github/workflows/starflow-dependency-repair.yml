name: Verify Starflow dependency repair
on:
  push:
    branches: [fix/cloudflare-dependency-security-20261120]
    paths:
      - 'starflow-social/package.json'
      - '.github/workflows/starflow-dependency-repair.yml'
permissions:
  contents: write
concurrency:
  group: starflow-dependency-repair
  cancel-in-progress: true
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/cloudflare-dependency-security-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: starflow-social
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist the generated lockfile on the repair branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: regenerate dependency lockfile from npm'
            git push origin HEAD:refs/heads/fix/cloudflare-dependency-security-20261120
          fi
      - name: Clean dependency installation
        run: npm ci --no-audit --no-fund
      - name: Report dependency security audit
        run: npm audit --json > "$RUNNER_TEMP/starflow-npm-audit.json" || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/starflow-npm-audit.json
      - run: npm run check
      - run: npm run lint
      - name: Verify actual Cloudflare build without deployment
        run: npm run build:cloudflare
