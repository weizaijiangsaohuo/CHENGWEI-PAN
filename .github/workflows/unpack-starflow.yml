name: Unpack Starflow Website

on:
  push:
    paths:
      - '.github/workflows/unpack-starflow.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unpack website source
        run: |
          test -f starflow-social-v3-redesign.zip
          unzip -q -o starflow-social-v3-redesign.zip
          test -f starflow-social/package.json

      - name: Save website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add starflow-social
          if ! git diff --cached --quiet; then
            git commit -m "Import Starflow V3 website"
            git push
          fi
