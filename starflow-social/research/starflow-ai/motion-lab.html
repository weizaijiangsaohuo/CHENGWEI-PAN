<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>Starflow AI Lab｜视频帧实验</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#090d16;color:#f4f6fb}
    *{box-sizing:border-box}
    body{margin:0;padding:22px max(16px,env(safe-area-inset-right)) 50px;line-height:1.6}
    main{max-width:690px;margin:auto}h1{font-size:25px;line-height:1.3}
    .tag{display:inline-block;background:#192641;color:#b8d7ff;padding:3px 9px;border-radius:20px;font-size:12px}
    .panel{background:#111929;border:1px solid #27334a;padding:16px;border-radius:16px;margin-top:16px}
    video{width:100%;max-height:360px;border-radius:12px;background:#02050a}
    input{display:block;width:100%;margin:12px 0}
    button{width:100%;min-height:48px;border:0;border-radius:12px;background:#628eff;color:#071122;font-weight:700;font-size:16px}
    button:disabled{opacity:.45}small,.muted{color:#a5b1c8}
    .metric{font-size:38px;font-weight:750;font-variant-numeric:tabular-nums}
    .error{color:#ffb3b3}
    .bar{height:8px;border-radius:20px;background:#222e44;overflow:hidden;margin:10px 0}
    .fill{height:100%;background:#83a7ff;width:0}
    canvas{max-width:100%;border-radius:8px;background:#03050a}
    ul{padding-left:20px}li{margin:7px 0}
  </style>
</head>
<body>
<main>
  <span class="tag">Starflow 自研实验 001 · 完全本地 · ¥0</span>
  <h1>视频帧变化分析</h1>
  <p class="muted">这是视频分析的第一个原创代码实验，不是 AI 视频生成模型。只在当前设备的浏览器里读取视频，不上传文件。</p>
  <section class="panel">
    <label for="file"><strong>第 1 步：选择一段自己的短视频</strong></label>
    <input id="file" type="file" accept="video/*">
    <video id="video" controls playsinline muted preload="metadata"></video>
    <p id="meta" class="muted">建议 5–10 秒；某些 iPhone 视频编码可能不被当前浏览器支持。</p>
    <button id="analyze" disabled>第 2 步：开始本地分析</button>
    <p id="status" role="status" aria-live="polite" class="muted">尚未选择视频</p>
    <div class="bar"><div id="progress" class="fill"></div></div>
  </section>
  <section class="panel" id="results" hidden>
    <strong>相邻采样帧平均像素差</strong>
    <div id="score" class="metric">—</div>
    <small>范围 0–255；越高仅说明采样画面变化更大，不代表质量更高、动作更准。</small>
    <p id="details"></p>
    <canvas id="frame" width="160" height="90" aria-label="末次采样视频画面"></canvas>
    <ul id="measurements"></ul>
  </section>
  <p class="muted"><small>提示：镜头切换、光线变化和拍摄抖动都会影响这个指标。浏览器仅在本地处理你选择的文件。研究代码尚未作为 Starflow 生产功能上线。</small></p>
</main>
<script>
(function () {
  'use strict';
  const file = document.getElementById('file');
  const video = document.getElementById('video');
  const analyze = document.getElementById('analyze');
  const status = document.getElementById('status');
  const meta = document.getElementById('meta');
  const progress = document.getElementById('progress');
  const results = document.getElementById('results');
  const score = document.getElementById('score');
  const details = document.getElementById('details');
  const measurements = document.getElementById('measurements');
  const frame = document.getElementById('frame');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  let objectUrl = null;
  let runToken = 0;

  function setStatus(text, error) {
    status.textContent = text;
    status.className = error ? 'error' : 'muted';
  }
  function prepare() {
    analyze.disabled = false;
    meta.textContent = '时长 ' + video.duration.toFixed(1) + ' 秒 · ' +
      video.videoWidth + '×' + video.videoHeight + ' · 分析不需要网络';
    setStatus('视频就绪，点击开始分析');
  }
  file.addEventListener('change', function () {
    runToken += 1;
    analyze.disabled = true;
    results.hidden = true;
    progress.style.width = '0%';
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = null;
    if (!file.files || !file.files[0]) { setStatus('请选择视频');return; }
    objectUrl = URL.createObjectURL(file.files[0]);
    video.src = objectUrl;
    video.load();
    setStatus('正在读取本地视频信息…');
  });
  video.addEventListener('loadedmetadata', function () {
    if (!Number.isFinite(video.duration) || video.duration <= .1) {
      setStatus('视频时长不可用，请更换短视频', true);
      return;
    }
    prepare();
  });
  video.addEventListener('error', function () {
    analyze.disabled = true;
    setStatus('视频解码失败，请尝试 H.264 MP4 格式', true);
  });

  function waitForSeek(target, token) {
    return new Promise(function (resolve, reject) {
      if (token !== runToken) { reject(new Error('已切换视频')); return; }
      let timeout;
      function cleanup() {
        clearTimeout(timeout);
        video.removeEventListener('seeked', onSeeked);
        video.removeEventListener('error', onError);
      }
      function onSeeked() {cleanup();resolve();}
      function onError() {cleanup();reject(new Error('无法读取视频帧'));}
      video.addEventListener('seeked', onSeeked, {once:true});
      video.addEventListener('error', onError, {once:true});
      timeout=setTimeout(function(){cleanup();reject(new Error('读取帧超时；请尝试更短的视频'));},12000);
      video.currentTime = target;
    });
  }
  function difference(a,b) {
    let sum=0, count=0;
    for(let i=0;i<a.length;i+=4){
      sum += Math.abs(a[i]-b[i]) + Math.abs(a[i+1]-b[i+1]) + Math.abs(a[i+2]-b[i+2]);
      count+=3;
    }
    return count ? sum/count : 0;
  }
  analyze.addEventListener('click', async function () {
    if (!video.videoWidth || !Number.isFinite(video.duration)) {
      setStatus('视频尚未准备好',true);return;
    }
    const token=++runToken;
    analyze.disabled=true;
    results.hidden=true;
    measurements.replaceChildren();
    score.textContent='—';
    const duration=video.duration;
    const samples=12;
    canvas.width=160;
    canvas.height=Math.max(1, Math.round(160 * video.videoHeight/video.videoWidth));
    frame.width=canvas.width;
    frame.height=canvas.height;
    let previous=null;
    const diffs=[];
    try {
      video.pause();
      for(let i=0;i<samples;i++){
        if(token!==runToken)throw new Error('分析已取消');
        const t=Math.min(duration-.04,Math.max(0.01,duration*(i+.5)/samples));
        if (Math.abs(video.currentTime-t) > .015 || video.readyState<2) {
          await waitForSeek(t,token);
        }
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
        if(previous){
          const val=difference(previous,data);
          diffs.push(val);
          const item=document.createElement('li');
          item.textContent='采样 '+(i+1)+' · '+t.toFixed(2)+'s · 差值 '+val.toFixed(2);
          measurements.appendChild(item);
        }
        previous=data;
        progress.style.width=((i+1)/samples*100).toFixed(1)+'%';
        setStatus('已完成 '+(i+1)+' / '+samples+' 帧');
      }
      frame.getContext('2d').drawImage(canvas,0,0);
      const average=diffs.reduce((a,b)=>a+b,0)/diffs.length;
      score.textContent=average.toFixed(2);
      details.textContent='完成 '+samples+' 个时间采样，计算 '+diffs.length+' 次帧差。视频文件仅在本地浏览器处理。';
      results.hidden=false;
      setStatus('本地分析完成');
    } catch (err) {
      setStatus(err && err.message ? err.message : '分析未完成',true);
    } finally {
      if (token===runToken) analyze.disabled=false;
    }
  });
})();
</script>
</body>
</html>
