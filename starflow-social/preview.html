<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="color-scheme" content="light dark"/><title>Starflow Studio 03 — 社交产品交互演示 / Social product preview</title><style>
/* STARFLOW STUDIO V3 — editorial, accessible, mobile-first. Original design. */
:root{--ink:#101114;--muted:#74767e;--line:#e9eaec;--paper:#fff;--soft:#f6f7f8;--hover:#f7f8fa;--accent:#1478ec;--accent-bg:#eaf3ff;--ring:#a3c9f6;--shadow:0 20px 80px rgba(12,18,28,.16);color-scheme:light}
:root[data-theme="dark"]{--ink:#f0f1f4;--muted:#9298a5;--line:#2b3038;--paper:#0c0e12;--soft:#171a20;--hover:#181d24;--accent:#65a9ff;--accent-bg:#102841;--ring:#2d6cc2;--shadow:0 20px 80px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft Yahei",Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ring);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}img{max-width:100%}.ico{width:21px;height:21px;stroke-width:1.85;flex:none;vertical-align:middle}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}
/* A low-key persistent preview banner, never implies live authentication */
.demo-ribbon{height:29px;position:relative;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10.5px;letter-spacing:.015em;z-index:55;padding:0 10px;text-align:center}.demo-ribbon button{border:0;color:inherit;background:transparent;font-size:10px;opacity:.73;text-decoration:underline;cursor:pointer}
.app{max-width:1320px;min-height:calc(100dvh - 29px);margin:0 auto;display:grid;grid-template-columns:minmax(220px,272px) minmax(0,624px) minmax(250px,340px)}
.side{position:sticky;top:29px;height:calc(100dvh - 29px);padding:24px 20px 18px 26px;display:flex;flex-direction:column;min-width:0}.brand{display:inline-flex;align-items:center;gap:11px;width:max-content;padding:0 0 29px 13px}.logo{height:36px;width:36px;background:var(--ink);color:var(--paper);border-radius:10px;display:grid;place-items:center}.logo svg{width:25px;height:25px}.brandname{font-size:24px;font-weight:800;letter-spacing:-1.6px;line-height:1}.brandname>span{color:var(--accent)!important}.sublabel{font-size:11px;color:var(--muted)}
.nav{display:grid;gap:5px}.navbtn{width:100%;display:flex;align-items:center;min-height:49px;gap:19px;text-align:left;background:none;border:0;color:var(--ink);padding:10px 14px;border-radius:12px;font-size:15px;font-weight:550;transition:background .15s}.navbtn .ico{width:23px;height:23px;stroke-width:1.75}.navbtn:hover{background:var(--hover)}.navbtn.active{font-weight:760;background:var(--soft)}.navbtn.active .ico{stroke-width:2.45}.tiny-tag{color:var(--muted);border:1px solid var(--line);border-radius:4px;font-size:9px;letter-spacing:.08em;padding:3px 5px;margin-left:auto}.primary{min-height:43px;display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:0 20px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:13px;font-weight:760;transition:background .15s,transform .15s}.primary:hover{opacity:.88}.primary.blue{background:var(--accent);border-color:var(--accent);color:#fff}.side-compose{min-height:48px;margin:22px 4px 0;width:calc(100% - 8px);font-size:15px}.side-bottom{margin-top:auto}.profile-short{display:flex;gap:10px;align-items:center;width:100%;min-width:0;padding:10px 7px;border:0;background:none;border-radius:12px;text-align:left;color:var(--ink)}.profile-short:hover{background:var(--soft)}.account-info{flex:1;min-width:0}.account-info b,.account-info small{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.account-info b{font-size:13px}.account-info small{font-size:12px;color:var(--muted);margin-top:4px}.lang-footer{padding:10px 7px}.avatar{border-radius:50%;height:42px;width:42px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:780;letter-spacing:-.2px;color:white;overflow:hidden;border:1px solid rgba(0,0,0,.04);background:#4b5563}.avatar.dark{background:linear-gradient(138deg,#111b2d,#53607b)}.avatar.peach{background:linear-gradient(145deg,#e2b2a4,#aa6373)}.avatar.purple{background:linear-gradient(140deg,#aeb4e0,#6561a6)}.avatar.sage{background:linear-gradient(140deg,#8dc1ad,#52797b)}.avatar.orange{background:linear-gradient(135deg,#edbf90,#a76745)}
.feed{border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:calc(100dvh - 29px);min-width:0}.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:29px;z-index:19;padding:0 21px;background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topbar h1{font-size:18px;font-weight:780;letter-spacing:-.6px;margin:0}.heading-sub{color:var(--muted);font-size:11px;margin-top:3px;display:block}.right-actions{display:flex;gap:6px;align-items:center}.pill{padding:8px 11px;min-height:35px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:11px;font-weight:650;display:flex;gap:7px;align-items:center;color:var(--ink)}.pill:hover{background:var(--hover)}.pill .ico{width:15px;height:15px}.iconbtn{width:36px;height:36px;display:inline-grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--muted)}.iconbtn:hover{background:var(--soft);color:var(--ink)}.iconbtn .ico{width:19px;height:19px}.mobile-top{display:none}
.feedtabs{display:flex;height:54px;border-bottom:1px solid var(--line)}.feedtabs button{flex:1;position:relative;background:none;border:0;color:var(--muted);font-size:13.5px;font-weight:620}.feedtabs button:hover{background:var(--hover)}.feedtabs button.active{color:var(--ink);font-weight:760}.feedtabs button.active:after{content:"";position:absolute;height:4px;border-radius:5px;bottom:0;left:50%;transform:translateX(-50%);width:55px;background:var(--accent)}
.compose{display:flex;gap:12px;padding:21px 18px 15px;border-bottom:7px solid var(--soft)}.compose-inner{flex:1;min-width:0}.compose textarea{width:100%;min-height:62px;padding:10px 0 4px;border:0;resize:vertical;outline:0;color:var(--ink);background:transparent;font-size:17px;line-height:1.5}.compose textarea::placeholder{color:#989ca3}.compose-controls{display:flex;align-items:center;gap:4px;margin-top:10px;padding-top:11px;border-top:1px solid var(--line)}.compose-controls .textblue{color:var(--accent)}.counter{color:var(--muted);font-size:11px;margin-left:auto;margin-right:8px}.compose-controls .primary{min-height:35px;padding:0 17px;font-size:12px}

 out=`<div class="admin-banner"><span>STARFLOW / STUDIO · ADMIN PREVIEW</span><h2>${t('management')}</h2><p>${t('managementDesc')} · ${demoLabel}</p></div>
 <nav class="admin-tabs" aria-label="Studio navigation">${tabs.map(([key,value])=>`<button class="${state.adminTab===key?'active':''}" data-admin-tab="${key}">${value}</button>`).join('')}</nav>`;
 if(state.adminTab==='overview')out+=`<div class="admin-grid">${[['activeUsers','8,492','+12.6%'],['postsToday','1,284','+8.2%'],['reports',state.reports.filter(r=>!r.done).length,''],['growth','18.4%','+2.4%']].map(([k,v,n])=>`<div class="statcard"><small>${t(k).toUpperCase()} · DEMO</small><strong>${v}</strong>${n?`<i>↗ ${n}</i>`:''}</div>`).join('')}</div><div class="admin-row"><h3>${labels.activity} · DEMO</h3><div class="mini-chart" aria-label="Sample activity visualization">${[41,57,49,70,63,83,95,75,89,73,88,92].map(v=>`<div class="bar" style="height:${v}%" title="${v}%"></div>`).join('')}</div><div class="mini-axis"><span>MON</span><span>WED</span><span>FRI</span><span>SUN</span></div></div><div class="admin-row"><h3>${t('moderation')}</h3>${state.reports.filter(r=>!r.done).slice(0,2).map(r=>`<div class="report">${icon('shield',20)}<div><strong>${safe(r[state.lang])}</strong><small>${safe(r.by)}</small></div><button class="secondary" data-admin-tab="review">${t('review')}</button></div>`).join('')||`<p>${t('allCaught')}</p>`}</div>`;
 if(state.adminTab==='review')out+=`<div class="admin-row" style="margin-top:18px"><h3>${t('moderation')} · ${demoLabel}</h3>${state.reports.filter(r=>!r.done).map(r=>`<div class="report">${icon('shield',21)}<div><strong>${safe(r[state.lang])}</strong><small>${safe(r.by)}</small></div><span class="status">${t('reports')}</span><button class="secondary" data-review="${r.id}">${t('review')}</button></div>`).join('')||`<p>${t('allCaught')}</p>`}</div>`;
 if(state.adminTab==='users')out+=`<div class="admin-row" style="margin-top:18px"><h3>${labels.people}</h3>${[['Mira Chen','@mirachn','MC','peach'],['Studio North','@studionorth','SN','purple'],['Evan Wu','@evanw','EW','dark']].map(([name,handle,avatar,color])=>`<div class="report">${ava(avatar,color,34)}<div><strong>${name}</strong><small>${handle} · ${labels.role}: member</small></div><span class="status" style="color:#16a085">${labels.status}: ✓</span></div>`).join('')}</div><p class="admin-note">${labels.notice}</p>`;
 if(state.adminTab==='system')out+=`<div class="admin-row" style="margin-top:18px"><h3>${t('system')} · DEMO</h3><div class="report">${icon('check',21)}<div><strong>${t('healthy')}</strong><small>${t('previewOnly')}</small></div></div><div class="report">${icon('shield',21)}<div><strong>Authentication / RLS</strong><small>Requires Supabase and real security configuration</small></div></div><div class="report">${icon('globe',21)}<div><strong>Edge hosting / HTTPS</strong><small>Requires Cloudflare deployment</small></div></div></div><p class="admin-note">${labels.notice}</p>`;
}

document.getElementById('viewRoot').innerHTML=out; if(state.view==='explore'&&state.query){const inp=document.getElementById('searchMain');inp?.focus();inp?.setSelectionRange(inp.value.length,inp.value.length)}}
function render(){renderShell();renderMain()}
function nav(view){state.view=view;state.query=view==='explore'?state.query:'';render();window.scrollTo({top:0,behavior:'instant'})}
function switchLang(lang){state.lang=lang==='en'?'en':'zh';try{localStorage.setItem('starflow-lang',state.lang)}catch{} render();if(!document.getElementById('modalLayer').hidden)showAuth(state.authMode);toast(t('languageChanged'))}
function doPublish(text,reply=false){text=text.trim();if(!text)return toast(t('needText'));state.items.unshift({id:++state.lastId,name:state.userName,handle:'@yourspace',avatar:'W',color:'dark',when:{zh:'刚刚',en:'now'},verified:false,body:text,likes:0,reposts:0,replies:0,liked:false,saved:false,reposted:false});nav('home');toast(reply?t('commentSaved'):t('postCreated'))}
function modal(html){document.getElementById('modalBody').innerHTML=html;document.getElementById('modalLayer').hidden=false;document.body.style.overflow='hidden'}function closeModal(){document.getElementById('modalLayer').hidden=true;document.body.style.overflow=''}
function showAuth(mode='signup'){state.authMode=mode;const signup=mode==='signup',forgot=mode==='forgot';modal(`<h2 id="modalTitle">${t(signup?'join':forgot?'forgotTitle':'welcomeBack')}</h2><p class="desc">${t(signup?'signupHelp':forgot?'forgotHelp':'loginHelp')}</p>${!forgot?`<button class="google-btn" data-auth-google><span class="google-g">G</span>${t('continueGoogle')}</button><div class="separator">${t('continueEmail')}</div>`:''}<form id="demoAuthForm">${signup?`<label class="field">${t('nickname')}<input placeholder="${t('nickname')}" required/></label>`:''}<label class="field">${t('email')}<input type="email" placeholder="you@example.com" required/></label>${!forgot?`<label class="field">${t('password')}<input type="password" minlength="8" placeholder="••••••••" required/></label>`:''}<button class="primary blue auth-btn" type="submit">${t(signup?'createAccount':forgot?'sendReset':'login')}</button></form><div class="auth-links"><button class="auth-link" data-auth-mode="${signup?'login':'signup'}">${t(signup?'goLogin':'goSignup')}</button>${!forgot?`<button class="auth-link" data-auth-mode="forgot">${t('forgotLink')}</button>`:''}</div><button style="margin-top:20px;border:0;background:transparent;color:var(--accent);padding:0;font-size:12px;font-weight:700" data-modal="mail">${t('welcomePreview')} →</button><p class="auth-notice">${t('demoOnly')}<br/>${t('noApple')}</p>`)}
function showMail(){modal(`<h2 id="modalTitle">${t('welcomeModal')}</h2><div class="welcome-mail"><div class="email-paper"><div class="email-brand"><strong>starflow.</strong><div style="color:#b6c0eb;font-size:11px;margin-top:9px">${t('mailSubject')}</div></div><div class="email-copy"><div style="font-size:31px">✦</div><h2>${t('mailTitle')}</h2><p>${t('mailText')}</p><button class="primary blue" id="mailToFeed">${t('joinDiscussion')} →</button><p style="margin-top:27px;font-size:11px;color:var(--muted)">${t('mailDisclaimer')}</p></div></div></div>`)}
function doFollow(h){state.following.has(h)?state.following.delete(h):state.following.add(h);renderShell();if(state.view==='home'&&state.tab==='following')renderMain()}
function flip(id,key){const p=state.items.find(x=>x.id===Number(id));if(!p)return;if(key==='like'){p.liked=!p.liked;p.likes+=p.liked?1:-1;toast(t('likedToast'))}else if(key==='repost'){p.reposted=!p.reposted;p.reposts+=p.reposted?1:-1;toast(t('shareToast'))}else if(key==='save'){p.saved=!p.saved;toast(t(p.saved?'savedToast':'unSavedToast'))}else if(key==='reply'){modal(`<h2 id="modalTitle">${t('reply')}</h2><p class="desc">${t('joinDiscussion')}</p><textarea id="replyText" class="field" maxlength="280" style="width:100%;min-height:126px;resize:vertical;padding:14px;border:1px solid var(--line);border-radius:12px" placeholder="${t('whatsNew')}"></textarea><button id="sendReply" data-parent="${p.id}" class="primary blue" style="width:100%;margin-top:12px">${t('reply')}</button>`);return}renderMain()}
document.addEventListener('click',e=>{const target=e.target.closest('button,[data-nav],[data-search]');if(!target)return;const d=target.dataset;if(d.nav){nav(d.nav);return}if(d.tab){state.tab=d.tab;renderMain();return}if(d.lang){switchLang(d.lang);return}if(d.theme){state.theme=d.theme;try{localStorage.setItem('starflow-theme',state.theme)}catch{}render();return}if(d.adminTab){state.adminTab=d.adminTab;renderMain();return}if(d.follow){doFollow(d.follow);return}if(d.like){flip(d.like,'like');return}if(d.repost){flip(d.repost,'repost');return}if(d.save){flip(d.save,'save');return}if(d.reply){flip(d.reply,'reply');return}if(d.share){toast(t('shareToast'));return}if(d.report){state.reports.unshift({id:++state.lastId,zh:'社区举报示例',en:'Community report sample',by:'@sample',done:false});toast(t('reportToast'));return}if(d.review){const r=state.reports.find(r=>r.id===Number(d.review));if(r){r.done=true;renderMain();toast(t('reviewToast'))}return}if(d.modal==='auth'){showAuth('signup');return}if(d.modal==='mail'){showMail();return}if(d.authMode){showAuth(d.authMode);return}if(d.authGoogle){toast(t('demoMessage'));return}if(d.extra){toast(t('previewOnly'));return}if(d.search){state.query=d.search;nav('explore');return}if(target.id==='publish'){doPublish(document.getElementById('composeText').value);return}if(target.id==='languageBtn'){switchLang(state.lang==='zh'?'en':'zh');return}if(target.id==='modalClose'){closeModal();return}if(target.id==='sideCompose'||target.id==='fab'){nav('home');document.getElementById('composeText')?.focus();return}if(target.id==='topAuth'||target.id==='moreButton'){showAuth('signup');return}if(target.id==='readAll'){state.notifs.forEach(n=>n.read=true);renderMain();return}if(target.id==='saveProfile'){state.userName=document.getElementById('editName').value.trim()||'Weizai';state.bio=document.getElementById('editBio').value.trim();render();toast(t('profileSaved'));return}if(target.id==='sendReply'){doPublish(document.getElementById('replyText').value,true);closeModal();return}if(target.id==='mailToFeed'){closeModal();nav('home');return}if(target.id==='demoDetails'){modal(`<h2 id="modalTitle">${t('shortcuts')}</h2><p class="desc">${t('howItWorks')}</p><button class="primary blue" id="detailsClose">${t('close')}</button>`);return}if(target.id==='detailsClose'){closeModal();return}});
document.addEventListener('submit',e=>{if(e.target.id==='demoAuthForm'){e.preventDefault();toast(t('authSuccess'))}});
document.addEventListener('input',e=>{if(e.target.id==='composeText'){document.getElementById('countLeft').textContent=280-[...e.target.value].length}if(e.target.id==='searchMain'){const v=e.target.value;state.query=v;const pos=e.target.selectionStart;renderMain();const inp=document.getElementById('searchMain');inp?.focus();inp?.setSelectionRange(pos,pos)}if(e.target.id==='sidebarSearch'){state.query=e.target.value;state.view='explore';render();document.getElementById('sidebarSearch').focus();document.getElementById('sidebarSearch').setSelectionRange(e.target.selectionStart,e.target.selectionStart)}});
document.getElementById('modalLayer').addEventListener('click',e=>{if(e.target.id==='modalLayer')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
})();
</script></body></html>
