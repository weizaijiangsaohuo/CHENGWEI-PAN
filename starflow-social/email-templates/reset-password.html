<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星流 Starflow 官方</title></head>
<body style="margin:0;padding:0;background-color:#f4f0f9;color:#222433;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;">
  <div style="display:none;font-size:1px;color:#f4f0f9;line-height:1px;max-height:0;opacity:0;overflow:hidden;">我们收到一项 Starflow 账号密码重置请求。点击下方按钮即可安全地设置新密码。</div>
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color:#f4f0f9;border-collapse:collapse;">
    <tr><td align="center" style="padding:36px 16px 42px;">
      <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:560px;border-collapse:collapse;">
        <tr><td align="center" style="padding:0 0 18px;">
          <img src="https://fix-auth-turnstile-check-weizai.weizai.workers.dev/starflow-mail-logo.png" width="66" height="66" alt="Starflow Logo" style="display:block;width:66px;height:66px;border:0;border-radius:18px;" />
          <div style="font-size:21px;font-weight:750;letter-spacing:1px;color:#191b28;margin-top:13px;">星流 <span style="font-size:13px;color:#736995;font-weight:600;letter-spacing:2.5px;">STARFLOW</span></div>
          <div style="font-size:11px;letter-spacing:3px;color:#877a9a;margin-top:6px;">官方账号服务 · OFFICIAL</div>
        </td></tr>
        <tr><td style="border:1px solid #e9e0f4;border-radius:22px;background-color:#ffffff;overflow:hidden;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
            <tr><td style="height:7px;background-color:#b49cfb;font-size:1px;line-height:7px;">&nbsp;</td></tr>
            <tr><td style="padding:39px 32px 12px;text-align:center;">
              <div style="font-size:11px;font-weight:700;color:#886de1;letter-spacing:3px;">STARFLOW ACCOUNT</div>
              <h1 style="font-size:27px;line-height:1.45;margin:14px 0 12px;color:#222234;font-weight:750;">重设你的登录密码</h1>
              <p style="font-size:15px;line-height:1.9;color:#66677b;margin:0 auto;max-width:410px;">我们收到一项 Starflow 账号密码重置请求。点击下方按钮即可安全地设置新密码。</p>
            </td></tr>
            <tr><td align="center" style="padding:26px 24px 30px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr><td bgcolor="#7461de" style="border-radius:12px;text-align:center;">
                  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:16px 38px;border-radius:12px;background-color:#7461de;color:#ffffff;font-size:16px;font-weight:700;line-height:1.4;text-decoration:none;">安全重设密码  →</a>
                </td></tr>
              </table>
            </td></tr>
            <tr><td style="padding:0 32px 34px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-radius:12px;background-color:#f8f6fc;">
                <tr><td style="padding:17px 18px;color:#797389;font-size:12px;line-height:1.9;">🔒 如果你没有发起密码重置请求，忽略本邮件即可；请勿将重置链接转发给他人。<br>如果这不是你的操作，请忽略此邮件，无需回复。</td></tr>
              </table>
            </td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:23px 12px 0;">
          <div style="font-size:12px;color:#89839a;line-height:1.9;">星流 Starflow 官方账号服务<br>本邮件由系统自动发送，请勿直接回复。</div>
          <div style="font-size:10px;color:#aaa4b9;line-height:2;padding-top:8px;">STARFLOW · CONNECTING MOMENTS</div>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
